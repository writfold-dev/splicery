# The Lean 4 proof project over the Charon/Aeneas translation of
# crates/splicery-splice. Built only inside the `proofs` compose image, where
# `aeneas` is the pinned release unpacked at /opt/aeneas (proofs/Dockerfile);
# lake-manifest.json pins mathlib and the rest of the dependency graph.
#
# This project is separate from formal/ (the reference calculus, Lean
# v4.21.0, core/Std only), which keeps its own toolchain and proofs. The
# statements here restate what they need from formal/ over the extracted
# kernel; see proofs/README.md.
name = "splicery-proofs"
defaultTargets = ["Extracted", "Kernel", "Audit"]

[[require]]
name = "aeneas"
path = "/opt/aeneas/backends/lean"

# Generated by proofs/extract.sh and committed; the gate refuses drift.
[[lean_lib]]
name = "Extracted"
globs = ["Extracted.+"]

# The theorems, stated over the extracted functions.
[[lean_lib]]
name = "Kernel"

# Every theorem's axioms, printed and checked against Lean's standard three.
[[lean_lib]]
name = "Audit"
roots = ["Audit"]
