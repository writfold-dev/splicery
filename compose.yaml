name: splicery

services:
  qualify:
    # scripts/gate always sets both variables. Unset, they name an image that
    # does not exist (never pulled) and a bind source that does not exist, so
    # `qualify` still refuses to run, while the self-contained `proofs`
    # service below stays usable without them.
    image: ${SPLICERY_TOOL_IMAGE:-splicery-unadmitted-tool-image}
    pull_policy: never
    platform: linux/amd64
    working_dir: /work/splicery
    network_mode: none
    cpus: 8
    mem_limit: 12884901888
    pids_limit: 1024
    init: true
    environment:
      CARGO_TARGET_DIR: /cache/target/rust-1.98.0
      CARGO_BUILD_JOBS: 8
      CARGO_NET_OFFLINE: "true"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work/splicery
    volumes:
      - type: bind
        source: .
        target: /work/splicery
        read_only: true
      - type: bind
        source: ${SPLICERY_ATTEMPT:-/nonexistent/splicery-attempt-unset}
        target: /evidence
      - target:/cache/target
      - registry:/opt/cargo/registry
      - git:/opt/cargo/git
    command: [python3, -B, tools/check_proofs.py, --evidence, /evidence/lean-proofs]

  # The Lean proof gate over the Charon/Aeneas translation of
  # crates/splicery-splice: regenerate, refuse drift against the committed
  # proofs/Extracted/, lake build, axiom audit, mutant calibration. It needs
  # no admitted tool image or evidence directory and runs on its own:
  #   docker compose run --build --rm proofs
  #   sh proofs/refresh.sh      # regenerate and copy out proofs/Extracted/
  proofs:
    profiles: [proofs]
    platform: linux/amd64
    build:
      context: .
      dockerfile: proofs/Dockerfile
      target: gate

volumes:
  target:
    name: splicery-rust-1.98.0-target
  registry:
    name: splicery-rust-1.98.0-registry
  git:
    name: splicery-rust-1.98.0-git
